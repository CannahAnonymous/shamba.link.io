services:
  - type: web
    name: shambalink-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://cannahanonymous.github.io
      - key: DATA_FILE
        value: /var/data/store.json
      - key: ADMIN_TOKEN
        sync: false
      - key: VISIT_WEBHOOK_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_TO_NUMBER
        value: +255741998751
    disk:
      name: shambalink-data
      mountPath: /var/data
      sizeGB: 1
